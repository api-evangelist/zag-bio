name: Zag Bio
description: >-
  Zag Bio is a clinical-stage biotechnology company developing thymus-targeted
  therapies for autoimmune diseases. The company engineers bifunctional
  antibodies that deliver self-antigens to antigen-presenting cells in the
  thymus, harnessing the body's natural process of central immune tolerance so
  developing immune cells learn to recognize, tolerate, and protect the body's
  own tissues. Its pipeline includes ZAG-101, a candidate for Type 1 Diabetes.
  Founded and incubated by Polaris Partners, Zag Bio launched publicly in
  October 2025 with an $80M Series A. It is tracked in the API Evangelist
  network as a Lightspeed Venture Partners portfolio company; as a therapeutics
  developer it publishes no public API or developer platform at this time.
